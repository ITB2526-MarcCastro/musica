<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Música">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Música</title>
<style>
:root{--bg:#1b1424;--surf:#271d35;--line:#3a2d4d;--tx:#f2edf7;--mut:#a99bbd;--ac:#8fe3d0;--ac-tx:#12301f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.view{display:none;padding:20px 16px calc(120px + env(safe-area-inset-bottom))}
.view.on{display:block}
#login{max-width:420px;margin:0 auto;padding-top:12vh}
#login h1{font-size:2.2rem;margin-bottom:6px}
#login p{color:var(--mut);margin:0 0 24px}
label{display:block;font-size:.9rem;color:var(--mut);margin:14px 0 4px}
input[type=text],input[type=password],input[type=url]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--tx);font:inherit}
.btn{width:100%;margin-top:22px;padding:13px;border-radius:10px;background:var(--ac);color:var(--ac-tx);font-weight:600}
.err{color:#ffb4a8;margin-top:14px;min-height:1.4em;font-size:.95rem}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
header h1{font-size:1.8rem}
header button{color:var(--mut);padding:6px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.alb{text-align:left}
.alb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--surf);display:block}
.alb b{display:block;margin-top:8px;font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alb span{display:block;color:var(--mut);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{color:var(--ac);margin-bottom:14px;padding:6px 0}
.head{display:flex;gap:16px;align-items:flex-end;margin-bottom:18px}
.head img{width:120px;height:120px;border-radius:6px;object-fit:cover;background:var(--surf)}
.head h2{font-size:1.5rem;line-height:1.2}
.head p{margin:4px 0 0;color:var(--mut)}
.tr{display:flex;width:100%;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;align-items:baseline}
.tr i{font-style:normal;color:var(--mut);width:1.6em;text-align:right;flex:none}
.tr em{font-style:normal;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr small{color:var(--mut)}
.tr.cur em,.tr.cur i{color:var(--ac)}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none}
#bar.on{display:block}
#np{display:flex;align-items:center;gap:12px}
#np img{width:44px;height:44px;border-radius:4px;object-fit:cover}
#np div{flex:1;min-width:0}
#np b,#np span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#np span{color:var(--mut);font-size:.85rem}
#np button{width:44px;height:44px;border-radius:50%;font-size:1.2rem}
#pp{background:var(--ac);color:var(--ac-tx)}
#seek{width:100%;margin:8px 0 0;accent-color:var(--ac)}
@media (prefers-reduced-motion:no-preference){.view.on{animation:in .18s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>

<main id="login" class="view">
  <h1>Música</h1>
  <p>Entra al teu servidor per escoltar la biblioteca.</p>
  <label for="srv">Adreça del servidor</label>
  <input id="srv" type="url" value="https://desktop-bbnvq3i.tailbebfdd.ts.net" autocapitalize="none" autocorrect="off">
  <label for="usr">Usuari</label>
  <input id="usr" type="text" autocapitalize="none" autocorrect="off" autocomplete="username">
  <label for="pwd">Contrasenya</label>
  <input id="pwd" type="password" autocomplete="current-password">
  <button class="btn" id="go">Entra</button>
  <div class="err" id="lerr" role="alert"></div>
</main>

<section id="lib" class="view">
  <header><h1>Biblioteca</h1><button id="out">Surt</button></header>
  <div class="grid" id="albums"></div>
  <div class="err" id="berr" role="alert"></div>
</section>

<section id="alb" class="view">
  <button class="back" id="back">Torna a la biblioteca</button>
  <div class="head"><img id="acov" alt=""><div><h2 id="atit"></h2><p id="aart"></p></div></div>
  <div id="tracks"></div>
</section>

<div id="bar">
  <div id="np">
    <img id="ncov" alt="">
    <div><b id="ntit"></b><span id="nart"></span></div>
    <button id="prev" aria-label="Anterior">&#9198;&#65038;</button>
    <button id="pp" aria-label="Reprodueix o pausa">&#9654;&#65038;</button>
    <button id="next" aria-label="Següent">&#9197;&#65038;</button>
  </div>
  <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posició">
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
const $=s=>document.querySelector(s);
const audio=$('#audio');
let S=null,queue=[],idx=-1;
try{S=JSON.parse(localStorage.getItem('session')||'null')}catch(e){}

const show=id=>{document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id))};
const qs=(extra={})=>new URLSearchParams({u:S.user,t:S.token,s:S.salt,v:'1.16.1',c:'musica-pwa',...extra});
const url=(ep,p)=>`${S.server}/rest/${ep}?${qs(p)}`;
async function api(ep,p){
  const r=await fetch(url(ep,{...p,f:'json'}));
  const j=(await r.json())['subsonic-response'];
  if(j.status!=='ok')throw new Error(j.error?.message||'Error del servidor');
  return j;
}

async function login(){
  const server=$('#srv').value.trim().replace(/\/+$/,''),user=$('#usr').value.trim(),pass=$('#pwd').value;
  $('#lerr').textContent='';
  try{
    const r=await fetch(server+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
    if(r.status===401)throw new Error('Usuari o contrasenya incorrectes.');
    if(!r.ok)throw new Error('El servidor ha respost amb l\u2019error '+r.status+'.');
    const j=await r.json();
    S={server,user,token:j.subsonicToken,salt:j.subsonicSalt};
    localStorage.setItem('session',JSON.stringify(S));
    $('#pwd').value='';
    loadLib();
  }catch(e){
    $('#lerr').textContent=e instanceof TypeError
      ?'No s\u2019ha pogut connectar. Comprova que Tailscale està actiu i que l\u2019adreça és correcta. Si ho està, el servidor pot estar bloquejant la connexió des d\u2019aquesta web (CORS).'
      :e.message;
  }
}

async function loadLib(){
  show('lib');$('#berr').textContent='';
  try{
    const j=await api('getAlbumList2',{type:'alphabeticalByName',size:500});
    const list=j.albumList2.album||[];
    const g=$('#albums');g.textContent='';
    if(!list.length)$('#berr').textContent='Encara no hi ha cap àlbum. Afegeix música a la carpeta del servidor.';
    list.forEach(a=>{
      const b=document.createElement('button');b.className='alb';
      b.innerHTML='<img loading="lazy" alt=""><b></b><span></span>';
      b.querySelector('img').src=url('getCoverArt',{id:a.coverArt||a.id,size:300});
      b.querySelector('b').textContent=a.name||a.title;
      b.querySelector('span').textContent=a.artist||'';
      b.onclick=()=>openAlbum(a.id);
      g.appendChild(b);
    });
  }catch(e){$('#berr').textContent='No s\u2019ha pogut carregar la biblioteca: '+e.message}
}

let cur=[];
async function openAlbum(id){
  show('alb');$('#tracks').textContent='';
  const a=(await api('getAlbum',{id})).album;
  cur=a.song||[];
  $('#acov').src=url('getCoverArt',{id:a.coverArt||a.id,size:300});
  $('#atit').textContent=a.name;$('#aart').textContent=a.artist||'';
  cur.forEach((t,i)=>{
    const b=document.createElement('button');b.className='tr';b.dataset.id=t.id;
    b.innerHTML='<i></i><em></em><small></small>';
    b.children[0].textContent=t.track||i+1;
    b.children[1].textContent=t.title;
    b.children[2].textContent=fmt(t.duration);
    b.onclick=()=>{queue=cur.slice();play(i)};
    $('#tracks').appendChild(b);
  });
  mark();
}

const fmt=s=>s?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'';
const mark=()=>document.querySelectorAll('.tr').forEach(r=>r.classList.toggle('cur',queue[idx]&&r.dataset.id===queue[idx].id));

function play(i){
  idx=i;const t=queue[i];
  audio.src=url('stream',{id:t.id});
  audio.play().catch(()=>{});
  const cov=url('getCoverArt',{id:t.coverArt||t.albumId||t.id,size:512});
  $('#bar').classList.add('on');
  $('#ncov').src=cov;$('#ntit').textContent=t.title;$('#nart').textContent=t.artist||'';
  mark();
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||'',album:t.album||'',artwork:[{src:cov,sizes:'512x512'}]});
  }
}
const next=()=>{if(idx+1<queue.length)play(idx+1)};
const prev=()=>{if(audio.currentTime>3||idx===0)audio.currentTime=0;else play(idx-1)};

audio.addEventListener('ended',next);
audio.addEventListener('play',()=>{$('#pp').innerHTML='&#9208;&#65038;'});
audio.addEventListener('pause',()=>{$('#pp').innerHTML='&#9654;&#65038;'});
audio.addEventListener('timeupdate',()=>{
  if(audio.duration)$('#seek').value=audio.currentTime/audio.duration*100;
  if('mediaSession' in navigator&&audio.duration&&navigator.mediaSession.setPositionState){
    try{navigator.mediaSession.setPositionState({duration:audio.duration,position:audio.currentTime,playbackRate:1})}catch(e){}
  }
});
$('#seek').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
$('#pp').onclick=()=>audio.paused?audio.play():audio.pause();
$('#next').onclick=next;$('#prev').onclick=prev;
if('mediaSession' in navigator){
  const m=navigator.mediaSession;
  m.setActionHandler('play',()=>audio.play());
  m.setActionHandler('pause',()=>audio.pause());
  m.setActionHandler('nexttrack',next);
  m.setActionHandler('previoustrack',prev);
  try{m.setActionHandler('seekto',e=>{audio.currentTime=e.seekTime})}catch(e){}
}

$('#go').onclick=login;
$('#pwd').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('#back').onclick=()=>show('lib');
$('#out').onclick=()=>{localStorage.removeItem('session');S=null;audio.pause();audio.removeAttribute('src');queue=[];idx=-1;$('#bar').classList.remove('on');show('login')};

if(S){loadLib()}else{show('login')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
