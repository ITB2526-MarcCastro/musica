<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LinLin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>LinLin</title>
<style>
:root{--bg:#121212;--card:#2a2a2a;--tx:#fff;--mut:#b3b3b3;--ac:#1ed760;--np:#3a3a3a;--navw:220px;--tabh:calc(56px + env(safe-area-inset-bottom))}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Helvetica Neue",sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2,h3{margin:0;font-weight:800}
h3{font-size:1.35rem;margin:28px 0 12px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{display:block}
.view{display:none}.view.on{display:block}
main{padding:16px 16px calc(var(--tabh) + 100px)}
body.auth #nav,body.auth #bar{display:none!important}
body.auth main{padding-bottom:20px}
.err{color:#ff9b8a;min-height:1.3em;font-size:.92rem;margin-top:8px}
.empty{color:var(--mut);padding:18px 0}

/* login */
#login{max-width:400px;margin:0 auto;padding-top:14vh;text-align:center}
.logo{font-size:3.2rem;letter-spacing:-.02em}
.logo b{color:var(--ac)}
.slogan{color:var(--mut);margin:6px 0 34px}
#login input{width:100%;padding:14px 16px;border-radius:6px;border:1px solid #727272;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:12px}
#login input::placeholder{color:#8a8a8a}
.btn{width:100%;margin-top:10px;padding:14px;border-radius:99px;background:var(--ac);color:#000;font-weight:700}

/* navegació */
#nav{position:fixed;left:0;right:0;bottom:0;height:var(--tabh);padding-bottom:env(safe-area-inset-bottom);display:flex;background:linear-gradient(rgba(18,18,18,.9),#121212 40%);z-index:5}
#nav .brand{display:none}
#nav .t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:.72rem;min-width:0}
#nav .t span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav .t svg{width:26px;height:26px}
#nav .t.on{color:var(--tx)}

/* mini reproductor */
#bar{position:fixed;left:8px;right:8px;bottom:calc(var(--tabh) + 6px);height:56px;border-radius:8px;background:var(--np);z-index:4;display:none;align-items:center;gap:10px;padding:0 8px;overflow:hidden;transition:background .4s}
#bar.on{display:flex}
#bar img{width:40px;height:40px;border-radius:4px;object-fit:cover;flex:none;background:#0004}
#binfo{flex:1;min-width:0;text-align:left}
#binfo b,#binfo span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#binfo b{font-size:.9rem}
#binfo span{font-size:.8rem;color:#ffffffb3}
#bar button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none}
#bar button svg{width:26px;height:26px}
#bprev,#bnext{display:none!important}
#prog{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#ffffff40}
#prog i{display:block;height:100%;width:0;background:#fff}

/* inici */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
#avatar{width:40px;height:40px;border-radius:50%;background:var(--ac);color:#000;font-weight:800;text-transform:uppercase}
.top h1{font-size:1.5rem}
.recents{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{display:flex;align-items:center;background:var(--card);border-radius:4px;overflow:hidden;text-align:left;min-width:0;height:56px}
.rc img{width:56px;height:56px;object-fit:cover;flex:none;background:#0004}
.rc b{padding:0 10px;font-size:.8rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hs{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .card{flex:none;width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.card{text-align:left;min-width:0}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--card);display:block}
.card.round img{border-radius:50%}.card.round{text-align:center}
.card b{display:block;margin-top:8px;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card span{display:block;color:var(--mut);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cerca */
.sbox{display:flex;align-items:center;gap:10px;background:#fff;color:#000;border-radius:6px;padding:0 12px;margin-top:14px}
.sbox svg{width:22px;height:22px;flex:none}
#q{flex:1;border:0;background:none;font:inherit;font-weight:600;padding:13px 0;color:#000;min-width:0}
#q::placeholder{color:#555}

/* biblioteca */
.chips{display:flex;gap:8px;margin:16px 0 8px}
.chips button{padding:7px 14px;border-radius:99px;background:var(--card);font-size:.88rem}
.chips button.on{background:var(--ac);color:#000;font-weight:600}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:6px 0;text-align:left}
.row img{width:56px;height:56px;object-fit:cover;border-radius:4px;background:var(--card);flex:none}
.row.round img{border-radius:50%}
.row div{min-width:0}
.row b,.row span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{color:var(--mut);font-size:.85rem}

/* detall */
.back{width:40px;height:40px;margin:-6px 0 6px -8px;display:flex;align-items:center}
.back svg{width:28px;height:28px}
#dcov{display:block;width:min(62vw,240px);aspect-ratio:1;object-fit:cover;margin:0 auto 20px;border-radius:4px;background:var(--card);box-shadow:0 8px 28px #0008}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.dhead h2{font-size:1.4rem;line-height:1.2}
.dhead p{margin:3px 0 0;color:var(--mut);font-size:.9rem}
#dplay{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#000;display:flex;align-items:center;justify-content:center;flex:none}
#dplay svg{width:30px;height:30px}
.tr{display:flex;align-items:center;gap:4px}
.tr .main{display:flex;flex:1;min-width:0;gap:12px;padding:8px 0;text-align:left;align-items:center}
.more{width:40px;height:40px;color:var(--mut);display:flex;align-items:center;justify-content:center;flex:none}
.more svg{width:22px;height:22px}
.tr i{font-style:normal;color:var(--mut);width:1.5em;text-align:center;flex:none}
.tr img{width:48px;height:48px;border-radius:4px;object-fit:cover;flex:none;background:var(--card)}
.tr div{flex:1;min-width:0}
.tr b,.tr span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr b{font-weight:600}.tr span{color:var(--mut);font-size:.85rem}
.tr small{color:var(--mut)}
.tr.cur b{color:var(--ac)}

/* pantalla "Ara sona" */


@media(min-width:800px){
  #nav{top:0;bottom:72px;right:auto;width:var(--navw);height:auto;flex-direction:column;justify-content:flex-start;padding:26px 12px;background:#000}
  #nav .brand{display:block;font-size:1.6rem;font-weight:800;margin:0 0 20px 12px}
  #nav .t{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;padding:11px 12px;font-size:1rem;font-weight:700}
  main{margin-left:var(--navw);padding:28px 32px 110px;max-width:1100px}
  body.auth main{margin-left:0;max-width:none}
  #bar{left:0;right:0;bottom:0;height:72px;border-radius:0;padding:0 24px}
  #bprev,#bnext{display:flex!important}
  #prog{left:0;right:0}
}
[hidden]{display:none!important}
.fbot{display:flex;justify-content:flex-end;margin-top:4px}
.fbot button{width:44px;height:44px;color:var(--mut);display:flex;align-items:center;justify-content:center}
.fbot svg{width:26px;height:26px}
.qtop{display:flex;align-items:center;gap:8px;font-weight:700}
.qtop button{width:40px;height:40px;margin-left:-8px}
#qlist{overflow:auto;flex:1;margin-top:6px}
#qlist h3{font-size:1.05rem;margin:16px 0 6px}
.qnote{color:var(--mut);font-size:.85rem;padding:8px 0}
.shufall{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:12px 16px;border-radius:99px;background:var(--ac);color:#000;font-weight:800;margin-bottom:16px;text-align:left}
.shufall svg{width:28px;height:28px;flex:none}
.shufall b{display:block}.shufall span{display:block;font-weight:500;font-size:.8rem;opacity:.75}
#dshuf{color:var(--mut);position:relative}#dshuf svg{width:26px;height:26px}#dshuf.on{color:var(--ac)}#dshuf.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac)}
.between{justify-content:space-between}
#newpl{color:var(--tx)}#newpl svg{width:28px;height:28px}
.dbtns{display:flex;align-items:center;gap:6px;flex:none}
.fmeta{display:flex;align-items:center;gap:2px}
.fmeta>div{flex:1;min-width:0}
#fheart svg{width:28px;height:28px}
#sheet{position:fixed;inset:0;z-index:20;display:none;background:#0009;align-items:flex-end}
#sheet.on{display:flex}
#sheetc{width:100%;max-height:80vh;overflow:auto;background:#282828;border-radius:14px 14px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sh{display:flex;gap:12px;align-items:center;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid #ffffff22}
.sh img{width:48px;height:48px;border-radius:4px;object-fit:cover}
.sh div{min-width:0}.sh b,.sh span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh span{color:var(--mut);font-size:.85rem}
.act{display:block;width:100%;text-align:left;padding:14px 4px;font-size:1rem}
.act.dng{color:#ff9b8a}
#nm{width:100%;padding:13px 14px;border-radius:6px;border:1px solid #727272;background:var(--bg);color:var(--tx);font:inherit;margin:10px 0 4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 76px);background:#fff;color:#000;padding:10px 16px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:30;display:none;max-width:90vw;text-align:center}
@media(min-width:800px){#sheet{align-items:center;justify-content:center}#sheetc{max-width:420px;border-radius:14px}#toast{bottom:92px}}
/* ===== millores visuals ===== */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:320px;background:linear-gradient(var(--hc,#2b2b3a),#12121200);opacity:0;transition:opacity .5s;z-index:-1;pointer-events:none}
body.tinted::before{opacity:.9}
img{transition:opacity .35s}
img:not(.ld){opacity:0}
.card img,.rc img,.row img,.tr img{background:linear-gradient(90deg,#2a2a2a 25%,#353535 50%,#2a2a2a 75%);background-size:200% 100%}
.card,.rc,.row,.shufall,.btn,.chips button,.tr .main,#nav .t{transition:transform .12s ease,background .2s}
.card:active,.rc:active,.row:active,.shufall:active,.btn:active,.chips button:active,#nav .t:active{transform:scale(.96)}
.rc:hover,.chips button:hover{background:#353535}
.tr .eq{display:none;align-items:flex-end;gap:2px;height:14px;margin-left:auto;padding-right:6px;flex:none}
.tr.cur .eq{display:flex}
.tr .eq i{display:block;width:3px;height:100%;background:var(--ac);border-radius:1px;transform-origin:bottom;transform:scaleY(.3);font-style:normal}
.qcur .eq{display:none!important}

/* reproductor a pantalla completa */
#full{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 24px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(var(--np) 0%,#121212 92%);transform:translateY(100%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s,background .5s}
#full.on{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s,background .5s}
.ftop{display:flex;align-items:center;justify-content:space-between;font-size:.85rem;font-weight:700}
.ftop button{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.ftop svg{width:24px;height:24px}
.ftop span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#fcov{width:100%;max-width:min(100%,46vh);aspect-ratio:1;object-fit:cover;border-radius:8px;margin:auto;box-shadow:0 16px 48px #000a;background:var(--card);transform:scale(.88);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
body.playing #fcov{transform:none}
.fmeta{gap:10px;margin-top:6px}
#ftit{font-size:1.5rem;font-weight:800;line-height:1.15}
#fart{color:#ffffffb3;margin-top:2px}
#fheart{width:44px;height:44px}#fheart svg{width:32px;height:32px}
#fseek{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:14px 0 0;background:none;--p:0%;cursor:pointer}
#fseek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,#fff var(--p),#ffffff40 var(--p))}
#fseek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px}
#fseek::-moz-range-track{height:4px;border-radius:2px;background:#ffffff40}
#fseek::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
#fseek::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;color:#ffffffb3;font-size:.75rem;margin-top:-2px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.ctl button{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.ctl svg{width:30px;height:30px}
.ctl #fpp{width:76px;height:76px;border-radius:50%;background:#fff;color:#000}
.ctl #fpp svg{width:38px;height:38px}
#fshuf.on,#ftimer.on{color:var(--ac)}
#fshuf.on::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac)}

/* cua de reproducció (full inferior) */
#qpanel{position:fixed;inset:0;z-index:15;visibility:hidden;background:#0000;transition:background .3s,visibility 0s .38s}
#qpanel.on{visibility:visible;background:#0008;transition:background .3s,visibility 0s}
#qsheet{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);height:74vh;display:flex;flex-direction:column;border-radius:28px;background:linear-gradient(var(--np),#1b1b1b 65%);overflow:hidden;transform:translateY(108%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
#qpanel.on #qsheet{transform:none}
.qgrab{width:44px;height:5px;border-radius:3px;background:#ffffff66;margin:10px auto 8px}
.qhead{padding:4px 20px 8px}
.qhead h2{font-size:1.7rem}
.qhead p{margin:2px 0 0;color:#ffffffb3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qlist{overflow:auto;flex:1;margin:0;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.qfoot{display:flex;gap:12px;padding:10px 16px 16px;flex:none}
.qfoot button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-radius:12px;background:#ffffff1f;font-size:.85rem}
.qfoot button.on{color:var(--ac)}
.qfoot svg{width:26px;height:26px}
.qr{height:64px;position:relative;transition:transform .18s}
.qr.drag{z-index:2;background:#3b3b3b;border-radius:8px;box-shadow:0 8px 24px #0009;transition:none}
.qr .grip{width:44px;height:44px;color:var(--mut);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;flex:none}
.qr .grip svg{width:22px;height:22px}
.qcur b{color:var(--ac)}
.qcur .play{width:44px;height:44px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;flex:none}
.qcur .play svg{width:24px;height:24px}
.qlab{display:flex;align-items:center;gap:8px;color:#ffffffb3;padding:14px 0 6px;font-size:.95rem}
.qlab svg{width:20px;height:20px;flex:none}
@media(min-width:800px){
  #qsheet{left:50%;right:auto;width:440px;transform:translate(-50%,108%)}
  #qpanel.on #qsheet{transform:translate(-50%,0)}
}

@media(prefers-reduced-motion:no-preference){
  .view.on{animation:in .24s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes sh{to{background-position:-200% 0}}
  .card img:not(.ld),.rc img:not(.ld),.row img:not(.ld),.tr img:not(.ld){animation:sh 1.4s linear infinite}
  @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  body.playing .tr.cur .eq i{animation:eq .9s ease-in-out infinite}
  body.playing .tr.cur .eq i:nth-child(2){animation-delay:.2s}
  body.playing .tr.cur .eq i:nth-child(3){animation-delay:.4s}
  #bar.on{animation:up .32s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  #nav .t svg{transition:transform .2s}
  #nav .t.on svg{transform:scale(1.1)}
}
</style>
</head>
<body class="auth">

<nav id="nav" aria-label="Navegació">
  <div class="brand">LinLin</div>
  <button class="t on" data-v="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l9 7.7V21h-6.2v-6.4H9.2V21H3V10.5z"/></svg><span>Inici</span></button>
  <button class="t" data-v="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Cerca</span></button>
  <button class="t" data-v="lib"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 4h2.6v16H3.5zM8.6 4h2.6v16H8.6zM14 5.6l2.5-.7 4 14.5-2.5.7z"/></svg><span>La teva biblioteca</span></button>
</nav>

<main>
  <div class="err" id="err" role="alert"></div>

  <section id="login" class="view on">
    <h1 class="logo">Lin<b>Lin</b></h1>
    <p class="slogan">Music for my ones</p>
    <input id="usr" type="text" placeholder="Usuari" aria-label="Usuari" autocapitalize="none" autocorrect="off" autocomplete="username">
    <input id="pwd" type="password" placeholder="Contrasenya" aria-label="Contrasenya" autocomplete="current-password">
    <button class="btn" id="go">Entra</button>
    <div class="err" id="lerr" role="alert"></div>
  </section>

  <section id="home" class="view">
    <div class="top"><button id="avatar" aria-label="Compte: toca per sortir"></button><h1>LinLin</h1></div>
    <button class="shufall" id="shufall"><div><b>Aleatori</b><span>Tota la biblioteca</span></div></button>
    <div class="recents" id="h-rec"></div>
    <div id="h-plw"><h3>Les teves llistes</h3><div class="hs" id="h-pl"></div></div>
  </section>

  <section id="search" class="view">
    <h1>Cerca</h1>
    <div class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      <input id="q" type="search" placeholder="Què vols escoltar?" aria-label="Cerca" autocapitalize="none" autocorrect="off"></div>
    <h3 hidden>Artistes</h3><div class="grid" id="s-art"></div>
    <h3 hidden>Àlbums</h3><div class="grid" id="s-alb"></div>
    <h3 hidden>Cançons</h3><div id="s-sng"></div>
    <div class="empty" id="s-none" hidden>No hi ha resultats.</div>
  </section>

  <section id="lib" class="view">
    <div class="top between"><h1>La teva biblioteca</h1><button class="more" id="newpl" aria-label="Crea una playlist"></button></div>
    <div class="chips">
      <button data-t="albums" class="on">Àlbums</button>
      <button data-t="artists">Artistes</button>
      <button data-t="playlists">Playlists</button>
    </div>
    <div id="l-list"></div>
    <div class="empty" id="l-none" hidden></div>
  </section>

  <section id="detail" class="view">
    <button class="back" id="back" aria-label="Enrere"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <img id="dcov" alt="">

    <div class="qfoot"><button id="qshuf"></button><button id="qtimer"></button></div>
  </div>
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
/* Adreça del servidor (Tailscale). Canvia-la aquí si mai canvia. */
const SERVER='https://desktop-bbnvq3i.tailbebfdd.ts.net';

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const audio=$('#audio');
const sv=(d,x='')=>`<svg viewBox="0 0 24 24" fill="currentColor" ${x}>${d}</svg>`;
const IC={
  play:sv('<path d="M8 5v14l11-7z"/>'),
  pause:sv('<path d="M6.5 5h3.8v14H6.5zM13.7 5h3.8v14h-3.8z"/>'),
  prev:sv('<path d="M6 5h2.2v14H6zM9.5 12L19 5v14z"/>'),
  next:sv('<path d="M15.8 5H18v14h-2.2zM14.5 12L5 5v14z"/>'),
  down:sv('<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>')
};
$('#bprev').innerHTML=$('#fprev').innerHTML=IC.prev;
$('#bnext').innerHTML=$('#fnext').innerHTML=IC.next;
Object.assign(IC,{
  more:sv('<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>'),
  heart:sv('<path d="M12 20.5s-8-5.2-8-11A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8 2.9c0 5.8-8 11-8 11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'),
  heartOn:sv('<path d="M12 20.5s-8-5.2-8-11A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8 2.9c0 5.8-8 11-8 11z"/>'),
  plus:sv('<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>')
});
$('#fclose').innerHTML=IC.down;$('#dplay').innerHTML=IC.play;
IC.shuffle=sv('<path d="M3 7h3.5c2 0 3.4 1 4.5 2.8l2 3.4c1.1 1.8 2.500 2.800 4.500 2.800H20M3 17h3.500c1.300 0 2.400-.4 3.300-1.200M13.500 7.500c.9-.3 1.800-.5 3-.5H20M17.500 4.500L20 7l-2.500 2.500M17.500 14.500L20 17l-2.500 2.500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>');$('#shufall').insertAdjacentHTML('afterbegin',IC.shuffle);$('#dshuf').innerHTML=IC.shuffle;IC.close=sv('<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>');
IC.queue=sv('<path d="M4 6h16M4 11h16M4 16h8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M15 14.5v6l5-3z"/>');
IC.like=sv('<circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v9M7.5 12h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>');
IC.liked=sv('<circle cx="12" cy="12" r="10" fill="#1ed760"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>');
IC.timer=sv('<circle cx="12" cy="13.5" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9.5v4.5l2.5 1.5M9.5 3h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>');
IC.grip=sv('<path d="M4 8h16M4 12h16M4 16h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>');
$('#fqueue').innerHTML=IC.queue;$('#fshuf').innerHTML=IC.shuffle;$('#ftimer').innerHTML=IC.timer;
$('#qshuf').innerHTML=IC.shuffle+'<span>Aleatori</span>';$('#qtimer').innerHTML=IC.timer+'<span>Temporitzador</span>';
$('#newpl').innerHTML=IC.plus;$('#dmore').innerHTML=IC.more;$('#fmore').innerHTML=IC.more;$('#fheart').innerHTML=IC.like;
const setPP=p=>{$('#pp').innerHTML=$('#fpp').innerHTML=p?IC.pause:IC.play;document.body.classList.toggle('playing',p);$$('.qcur .play').forEach(b=>{b.innerHTML=p?IC.pause:IC.play})};setPP(false);

let S=null,queue=[],idx=-1,prevView='home',libTab='albums',scrobbled=false,likes=new Set(),curDet=null,rnd=false,loadingMore=false,queueName='',shufOn=false,origUp=null,sleepT=null,stopAfter=false,pre=null,curBlob=null,preBusy=0,advancing=false,errN=0;
try{S=JSON.parse(localStorage.getItem('session')||'null')}catch(e){}

document.addEventListener('load',e=>{if(e.target.tagName==='IMG')e.target.classList.add('ld')},true);
const qs=(x={})=>{
  const p=new URLSearchParams({u:S.user,t:S.token,s:S.salt,v:'1.16.1',c:'linlin'});
  for(const [k,v] of Object.entries(x))Array.isArray(v)?v.forEach(i=>p.append(k,i)):p.set(k,v);
  return p;
};
const url=(ep,p)=>`${SERVER}/rest/${ep}?${qs(p)}`;
const cover=(o,s=300)=>url('getCoverArt',{id:o.coverArt||o.albumId||o.id,size:s});
const fmt=s=>s?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const msg=t=>{$('#err').textContent=t||''};

async function api(ep,p){
  const r=await fetch(url(ep,{...p,f:'json'}));
  const j=(await r.json())['subsonic-response'];
  if(j.status!=='ok'){
    if(j.error&&(j.error.code===40||j.error.code===41)){logout();throw new Error('La sessió ha caducat. Torna a entrar.')}
    throw new Error(j.error?.message||'Error del servidor');
  }
  return j;
}

/* ---------- sessió ---------- */
async function login(){
  const user=$('#usr').value.trim(),pass=$('#pwd').value;
  $('#lerr').textContent='';
  try{
    const r=await fetch(SERVER+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
    if(r.status===401)throw new Error('Usuari o contrasenya incorrectes.');
    if(!r.ok)throw new Error('El servidor ha respost amb l\u2019error '+r.status+'.');
    const j=await r.json();
    S={user,token:j.subsonicToken,salt:j.subsonicSalt};
    localStorage.setItem('session',JSON.stringify(S));
    $('#pwd').value='';enter();
  }catch(e){
    $('#lerr').textContent=e instanceof TypeError
      ?'No s\u2019ha pogut connectar. Comprova que Tailscale està actiu al mòbil i que el portàtil està encès.'
      :e.message;
  }
}
function logout(){
  localStorage.removeItem('session');S=null;likes=new Set();
  audio.pause();audio.removeAttribute('src');queue=[];idx=-1;rnd=false;if(curBlob){URL.revokeObjectURL(curBlob);curBlob=null}if(pre){URL.revokeObjectURL(pre.url);pre=null}
  $('#bar').classList.remove('on');$('#full').classList.remove('on');
  document.body.classList.add('auth');go('login',false);
}
function enter(){
  document.body.classList.remove('auth');
  $('#avatar').textContent=S.user.charAt(0);loadLikes();
  go('home');loadHome();
}
$('#avatar').onclick=()=>{if(confirm('Vols tancar la sessió?'))logout()};

/* ---------- navegació ---------- */
function go(v,tab=true){
  $$('.view').forEach(e=>e.classList.toggle('on',e.id===v));
  if(tab){$$('#nav .t').forEach(b=>b.classList.toggle('on',b.dataset.v===v));prevView=v}
  msg('');window.scrollTo(0,0);document.body.classList.toggle('tinted',v==='home'||v==='detail');
}
$$('#nav .t').forEach(b=>b.onclick=()=>{
  const v=b.dataset.v;go(v);
  if(v==='home')loadHome();if(v==='lib')loadLib();if(v==='search')$('#q').focus();
});
$('#back').onclick=()=>go(prevView);
$$('.chips button').forEach(b=>b.onclick=()=>{
  libTab=b.dataset.t;$$('.chips button').forEach(x=>x.classList.toggle('on',x===b));loadLib();
});

/* ---------- peces d'interfície ---------- */
function card(o,title,sub,fn,round){
  const b=document.createElement('button');b.className='card'+(round?' round':'');
  b.innerHTML='<img loading="lazy" alt=""><b></b><span></span>';
  b.children[0].src=o.img||cover(o);b.children[1].textContent=title;b.children[2].textContent=sub||'';
  b.onclick=fn;return b;
}
function row(o,title,sub,fn,round){
  const b=document.createElement('button');b.className='row'+(round?' round':'');
  b.innerHTML='<img loading="lazy" alt=""><div><b></b><span></span></div>';
  b.children[0].src=o.img||cover(o,120);b.querySelector('b').textContent=title;b.querySelector('span').textContent=sub;
  b.onclick=fn;return b;
}
const albumCards=(el,l)=>{el.textContent='';l.forEach(a=>el.append(card(a,a.name||a.title,a.artist,()=>openAlbum(a.id))))};
const artistCards=(el,l)=>{el.textContent='';l.forEach(a=>el.append(card(a,a.name,'Artista',()=>openArtist(a.id),true)))};

function tracks(el,songs,art,ctx){
  el.textContent='';
  songs.forEach((t,i)=>{
    const r=document.createElement('div');r.className='tr';r.dataset.id=t.id;
    r.innerHTML='<button class="main">'+(art?'<img loading="lazy" alt="">':'<i></i>')+'<div><b></b><span></span></div><span class="eq"><i></i><i></i><i></i></span></button><button class="more" aria-label="Més opcions"></button>';
    const m=r.children[0],o=r.children[1];
    if(art)m.children[0].src=cover(t,120);else m.children[0].textContent=i+1;
    m.querySelector('b').textContent=t.title;
    m.querySelector('span').textContent=t.artist||'';
    o.innerHTML=IC.more;
    m.onclick=()=>startQueue(songs,i);
    o.onclick=()=>trackMenu(t,ctx?{plId:ctx.plId,index:i}:null);
    el.append(r);
  });
  mark();
}
const mark=()=>$$('.tr').forEach(r=>r.classList.toggle('cur',!!queue[idx]&&r.dataset.id===queue[idx].id));

/* ---------- pantalles ---------- */
const LIKED_IMG='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3bd6"/><stop offset="1" stop-color="#9ec9c0"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><path d="M50 73S27 58 27 43c0-8 6-14 13-14 4 0 8 2 10 6 2-4 6-6 10-6 7 0 13 6 13 14 0 15-23 30-23 30z" fill="#fff"/></svg>');
const syncChips=()=>$$('.chips button').forEach(x=>x.classList.toggle('on',x.dataset.t===libTab));

async function loadLikes(){
  try{const r=(await api('getStarred2')).starred2||{};likes=new Set((r.song||[]).map(x=>x.id));syncHeart()}catch(e){}
}

async function loadHome(){
  try{
    let l=(await api('getAlbumList2',{type:'recent',size:6})).albumList2.album||[];
    if(!l.length)l=(await api('getAlbumList2',{type:'newest',size:6})).albumList2.album||[];
    if(l[0])paint(cover(l[0],120));
    const g=$('#h-rec');g.textContent='';
    l.forEach(a=>{
      const b=document.createElement('button');b.className='rc';
      b.innerHTML='<img alt=""><b></b>';b.children[0].src=cover(a,120);b.children[1].textContent=a.name||a.title;
      b.onclick=()=>openAlbum(a.id);g.append(b);
    });
    const pl=(await api('getPlaylists')).playlists.playlist||[];
    const h=$('#h-pl');h.textContent='';
    h.append(card({img:LIKED_IMG},"M'agrada",'Playlist',openStarred));
    pl.forEach(p=>h.append(card(p,p.name,(p.songCount||0)+' cançons',()=>openPlaylist(p.id))));
  }catch(e){msg('No s\u2019ha pogut carregar l\u2019inici: '+e.message)}
}

async function loadLib(){
  const g=$('#l-list'),n=$('#l-none');n.hidden=true;g.textContent='';
  try{
    if(libTab==='albums'){
      const l=(await api('getAlbumList2',{type:'alphabeticalByName',size:500})).albumList2.album||[];
      l.forEach(a=>g.append(row(a,a.name||a.title,'Àlbum \u00b7 '+(a.artist||''),()=>openAlbum(a.id))));
      if(!l.length){n.hidden=false;n.textContent='Encara no hi ha cap àlbum. Afegeix música a la carpeta del servidor.'}
    }else if(libTab==='artists'){
      const l=((await api('getArtists')).artists.index||[]).flatMap(i=>i.artist||[]);
      l.forEach(a=>g.append(row(a,a.name,'Artista',()=>openArtist(a.id),true)));
      if(!l.length){n.hidden=false;n.textContent='Encara no hi ha cap artista.'}
    }else{
      const l=(await api('getPlaylists')).playlists.playlist||[];
      g.append(row({img:LIKED_IMG},"M'agrada",'Playlist \u00b7 '+likes.size+' cançons',openStarred));
      l.forEach(p=>g.append(row(p,p.name,'Playlist \u00b7 '+(p.songCount||0)+' cançons',()=>openPlaylist(p.id))));
    }
  }catch(e){msg('No s\u2019ha pogut carregar la biblioteca: '+e.message)}
}

function detail(h,songs,albums,meta){
  curDet=meta?{...meta,songs:songs||[]}:null;
  $('#dcov').src=h.img;paint(h.img);$('#dtit').textContent=h.title;$('#dsub').textContent=h.sub||'';
  const t=$('#dtracks'),g=$('#dgrid');t.textContent='';g.textContent='';
  $('#dmore').hidden=!(meta&&(meta.type==='album'||meta.type==='playlist'));
  const p=$('#dplay'),sh=$('#dshuf'),isA=!!meta&&meta.type==='artist';p.hidden=sh.hidden=!(isA||(songs&&songs.length));
  if(songs){tracks(t,songs,false,meta&&meta.type==='playlist'?{plId:meta.id}:null);p.onclick=()=>playList(songs)}
  sh.onclick=toggleShuffle;if(isA)p.onclick=()=>artistPlay(meta);
  if(albums)albumCards(g,albums);
  go('detail',false);
}
async function openAlbum(id){try{const a=(await api('getAlbum',{id})).album;detail({img:cover(a,500),title:a.name,sub:a.artist},a.song||[],null,{type:'album',id,name:a.name})}catch(e){msg(e.message)}}
async function openArtist(id){try{const a=(await api('getArtist',{id})).artist;detail({img:cover(a,500),title:a.name,sub:'Artista \u00b7 '+(a.album||[]).length+' àlbums'},null,a.album||[],{type:'artist',id,name:a.name,albums:a.album||[]})}catch(e){msg(e.message)}}
async function openPlaylist(id){try{const p=(await api('getPlaylist',{id})).playlist;detail({img:cover(p,500),title:p.name,sub:'Playlist \u00b7 '+(p.songCount||0)+' cançons'},p.entry||[],null,{type:'playlist',id,name:p.name})}catch(e){msg(e.message)}}
async function openStarred(){
  try{
    const s=((await api('getStarred2')).starred2||{}).song||[];
    likes=new Set(s.map(x=>x.id));
    detail({img:LIKED_IMG,title:"M'agrada",sub:'Playlist \u00b7 '+s.length+' cançons'},s,null,{type:'starred'});
  }catch(e){msg(e.message)}
}

/* ---------- full d'opcions, M'agrada i playlists ---------- */
let tt;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>{e.style.display='none'},2200)}
const closeSheet=()=>$('#sheet').classList.remove('on');
function openSheet(build){const s=$('#sheetc');s.textContent='';build(s);$('#sheet').classList.add('on')}
function shead(s,title,sub,img){
  const d=document.createElement('div');d.className='sh';
  d.innerHTML=(img?'<img alt="">':'')+'<div><b></b><span></span></div>';
  if(img)d.children[0].src=img;
  d.querySelector('b').textContent=title;d.querySelector('span').textContent=sub||'';s.append(d);
}
function act(s,label,fn,danger){
  const b=document.createElement('button');b.className='act'+(danger?' dng':'');b.textContent=label;
  b.onclick=()=>{Promise.resolve(fn()).catch(e=>{closeSheet();msg(e.message)})};s.append(b);
}
function askName(title,val,cb){
  openSheet(s=>{
    const h=document.createElement('b');h.textContent=title;s.append(h);
    const i=document.createElement('input');i.id='nm';i.value=val;i.placeholder='Nom de la playlist';i.maxLength=80;s.append(i);
    const ok=async()=>{const n=i.value.trim();if(!n)return;closeSheet();try{await cb(n)}catch(e){msg(e.message)}};
    i.onkeydown=e=>{if(e.key==='Enter')ok()};
    const b=document.createElement('button');b.className='btn';b.textContent='Desa';b.onclick=ok;s.append(b);
    setTimeout(()=>i.focus(),60);
  });
}
function syncHeart(){
  const t=queue[idx],on=!!t&&likes.has(t.id),b=$('#fheart');
  b.innerHTML=on?IC.liked:IC.like;b.style.color=on?'':'#fff';b.setAttribute('aria-pressed',on);
}
async function toggleLike(t){
  const on=!likes.has(t.id);
  on?likes.add(t.id):likes.delete(t.id);syncHeart();
  try{await api(on?'star':'unstar',{id:t.id});toast(on?'Afegit a M\u2019agrada':'Tret de M\u2019agrada')}
  catch(e){on?likes.delete(t.id):likes.add(t.id);syncHeart();msg(e.message)}
}
function trackMenu(t,ctx){
  openSheet(s=>{
    shead(s,t.title,t.artist,cover(t,120));
    act(s,likes.has(t.id)?'Treu de M\u2019agrada':'Afegeix a M\u2019agrada',()=>{closeSheet();return toggleLike(t)});
    act(s,'Reprodueix a continuació',()=>{closeSheet();if(idx<0)startQueue([t],0);else{queue.splice(idx+1,0,t);toast('Sonarà a continuació')}});
    act(s,'Afegeix a la cua',()=>{closeSheet();if(idx<0)startQueue([t],0);else{queue.push(t);toast('Afegit a la cua')}});
    act(s,'Afegeix a una playlist',()=>pickPlaylist([t.id]));
    if(ctx)act(s,'Treu d\u2019aquesta playlist',async()=>{
      await api('updatePlaylist',{playlistId:ctx.plId,songIndexToRemove:ctx.index});
      closeSheet();toast('Cançó treta');openPlaylist(ctx.plId);
    });
  });
}
async function pickPlaylist(ids){
  const pls=(await api('getPlaylists')).playlists.playlist||[];
  openSheet(s=>{
    shead(s,'Afegeix a una playlist','');
    act(s,'+ Nova playlist',()=>askName('Nova playlist','',async n=>{
      await api('createPlaylist',{name:n,songId:ids});toast('Playlist creada: '+n);
    }));
    pls.forEach(p=>act(s,p.name,async()=>{
      await api('updatePlaylist',{playlistId:p.id,songIdToAdd:ids});closeSheet();toast('Afegit a '+p.name);
    }));
  });
}
function newPlaylist(){
  askName('Nova playlist','',async n=>{
    await api('createPlaylist',{name:n});toast('Playlist creada: '+n);
    libTab='playlists';syncChips();loadLib();
  });
}
async function delPl(d){
  closeSheet();
  if(!confirm('Vols esborrar la playlist «'+d.name+'»? Les cançons no s\u2019esborren.'))return;
  await api('deletePlaylist',{id:d.id});toast('Playlist esborrada');
  libTab='playlists';syncChips();go('lib');loadLib();
}
function dMenu(){
  const d=curDet;if(!d)return;
  openSheet(s=>{
    shead(s,d.name,d.type==='playlist'?'Playlist':'Àlbum',$('#dcov').src);
    act(s,'Afegeix a una playlist',()=>pickPlaylist(d.songs.map(x=>x.id)));
    if(d.type==='playlist'){
      act(s,'Canvia el nom',()=>askName('Canvia el nom',d.name,async n=>{
        await api('updatePlaylist',{playlistId:d.id,name:n});d.name=n;$('#dtit').textContent=n;toast('Nom actualitzat');
      }));
      act(s,'Esborra la playlist',()=>delPl(d),true);
    }
  });
}

/* ---------- aleatori i artistes sencers ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function startQueue(l,i=0,r=false,sh,name){
  const on=r||(sh===undefined?shufOn:sh);
  let q=l.slice(),start=i;origUp=null;
  if(on&&!r&&q.length>1){            /* mode aleatori: sona la cançó triada i la resta es barreja */
    origUp=l.slice();const cur=q.splice(i,1)[0];q=[cur].concat(shuffle(q));start=0;
  }
  rnd=r;queue=q;shufOn=on;
  queueName=name!==undefined?name:($('#detail').classList.contains('on')?$('#dtit').textContent:'');
  syncShuf();play(start);
}
function playList(l){if(l&&l.length)startQueue(l,shufOn?Math.floor(Math.random()*l.length):0)}
async function playAllRandom(){
  try{
    const l=(await api('getRandomSongs',{size:500})).randomSongs?.song||[];
    if(!l.length){msg('No hi ha cançons a la biblioteca.');return}
    startQueue(l,0,true,true,'tota la biblioteca');toast('Tota la biblioteca en aleatori');
  }catch(e){msg(e.message)}
}
async function moreRandom(){
  if(loadingMore)return;loadingMore=true;
  try{const l=(await api('getRandomSongs',{size:100})).randomSongs?.song||[];queue=queue.concat(l)}catch(e){}
  loadingMore=false;
}
async function artistPlay(meta){
  try{
    toast('Carregant les cançons\u2026');
    if(!meta.songs)meta.songs=(await Promise.all(meta.albums.map(a=>api('getAlbum',{id:a.id}).then(r=>r.album.song||[])))).flat();
    if(!meta.songs.length){msg('Aquest artista no té cançons.');return}
    startQueue(meta.songs,shufOn?Math.floor(Math.random()*meta.songs.length):0,false,undefined,meta.name);
  }catch(e){msg(e.message)}
}

/* ---------- cua de reproducció ---------- */
function qrow(i,cur){
  const t=queue[i],d=document.createElement('div');d.className='tr qr'+(cur?' cur qcur':'');
  d.innerHTML='<button class="main"><img alt=""><div><b></b><span></span></div></button>'+(cur?'<button class="play" aria-label="Reprodueix o pausa"></button>':'<button class="more" aria-label="Treu de la cua"></button><button class="grip" aria-label="Canvia l\u2019ordre"></button>');
  d.querySelector('img').src=cover(t,120);
  d.querySelector('b').textContent=t.title;d.querySelector('span').textContent=t.artist||'';
  if(cur){
    const b=d.children[1];b.innerHTML=audio.paused?IC.play:IC.pause;b.onclick=toggle;
  }else{
    d.children[0].onclick=()=>play(i);
    d.children[1].innerHTML=IC.close;d.children[1].onclick=()=>{queue.splice(i,1);renderQueue()};
    d.children[2].innerHTML=IC.grip;d.children[2].onpointerdown=ev=>dragRow(ev,d);
  }
  return d;
}
function dragRow(e,row){
  e.preventDefault();e.stopPropagation();
  const grip=e.currentTarget,rows=$$('#qlist .qr:not(.qcur)'),from=rows.indexOf(row);
  if(from<0)return;
  const h=row.offsetHeight,y0=e.clientY;let to=from;
  try{grip.setPointerCapture(e.pointerId)}catch(_){}
  row.classList.add('drag');
  const move=ev=>{
    const dy=ev.clientY-y0;
    row.style.transform='translateY('+dy+'px)';
    to=Math.max(0,Math.min(rows.length-1,from+Math.round(dy/h)));
    rows.forEach((r,k)=>{
      if(r===row)return;
      let off=0;
      if(from<to&&k>from&&k<=to)off=-h;
      if(from>to&&k<from&&k>=to)off=h;
      r.style.transform=off?'translateY('+off+'px)':'';
    });
  };
  const up=()=>{
    grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',up);grip.removeEventListener('pointercancel',up);
    if(to!==from){const [m]=queue.splice(idx+1+from,1);queue.splice(idx+1+to,0,m);prefetchNext()}
    renderQueue();
  };
  grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);
}
function renderQueue(){
  const l=$('#qlist');l.textContent='';
  if(idx<0||!queue[idx]){$('#qsub').textContent='';l.innerHTML='<div class="qnote">No hi ha res en reproducció.</div>';return}
  $('#qsub').textContent='S\u2019està reproduint '+(queueName||queue[idx].artist||'');
  l.append(qrow(idx,true));
  const lab=document.createElement('div');lab.className='qlab';
  lab.innerHTML=(shufOn?IC.shuffle:'')+'<span></span>';
  lab.querySelector('span').textContent=shufOn?'S\u2019està reproduint aleatòriament des de:':'A continuació:';
  l.append(lab);
  const rest=queue.length-idx-1;
  if(!rest){const n=document.createElement('div');n.className='qnote';n.textContent='No queda cap cançó a la cua.';l.append(n)}
  for(let i=idx+1;i<Math.min(queue.length,idx+101);i++)l.append(qrow(i,false));
  if(rest>100){const n=document.createElement('div');n.className='qnote';n.textContent='I '+(rest-100)+' cançons més.';l.append(n)}
}
const openQ=()=>{renderQueue();$('#qpanel').classList.add('on')};
const closeQ=()=>$('#qpanel').classList.remove('on');
$('#fqueue').onclick=openQ;
$('#qpanel').onclick=e=>{if(e.target.id==='qpanel')closeQ()};

function syncShuf(){['#fshuf','#qshuf','#dshuf'].forEach(q=>{const e=$(q);e.classList.toggle('on',shufOn);e.setAttribute('aria-pressed',shufOn)})}
function toggleShuffle(){
  /* és un mode: la cançó que sona no canvia mai, només l'ordre del que ve darrere */
  if(idx<0||!queue[idx]){shufOn=!shufOn;origUp=null;syncShuf();toast(shufOn?'Aleatori activat':'Aleatori desactivat');return}
  if(!shufOn){
    origUp=queue.slice();
    queue=queue.slice(0,idx+1).concat(shuffle(queue.slice(idx+1)));
    shufOn=true;toast('Aleatori activat');
  }else{
    if(origUp){
      const cur=queue[idx],k=origUp.indexOf(cur),os=new Set(origUp);
      if(k>=0){const extra=queue.slice(idx+1).filter(t=>!os.has(t));queue=queue.slice(0,idx+1).concat(origUp.slice(k+1),extra)}
    }
    shufOn=false;origUp=null;toast('Aleatori desactivat');
  }
  syncShuf();prefetchNext();if($('#qpanel').classList.contains('on'))renderQueue();
}
$('#fshuf').onclick=toggleShuffle;$('#qshuf').onclick=toggleShuffle;

const syncTimer=()=>{const on=!!(sleepT||stopAfter);$('#ftimer').classList.toggle('on',on);$('#qtimer').classList.toggle('on',on)};
function setSleep(min,eot){
  clearTimeout(sleepT);sleepT=null;stopAfter=false;
  if(min){sleepT=setTimeout(()=>{audio.pause();sleepT=null;syncTimer();toast('Temporitzador: música aturada')},min*60000);toast('La música s\u2019aturarà d\u2019aquí '+min+' min')}
  else if(eot){stopAfter=true;toast('S\u2019aturarà al final de la cançó')}
  else toast('Temporitzador desactivat');
  syncTimer();
}
function sleepMenu(){
  openSheet(s=>{
    shead(s,'Temporitzador','Atura la música automàticament');
    [[15,'15 minuts'],[30,'30 minuts'],[45,'45 minuts'],[60,'1 hora']].forEach(([m,l])=>act(s,l,()=>{closeSheet();setSleep(m)}));
    act(s,'Al final de la cançó',()=>{closeSheet();setSleep(0,true)});
    if(sleepT||stopAfter)act(s,'Desactiva el temporitzador',()=>{closeSheet();setSleep(0,false)},true);
  });
}
$('#ftimer').onclick=sleepMenu;$('#qtimer').onclick=sleepMenu;

/* arrossegar cap avall per tancar */
function swipeDown(handle,panel,close){
  let y0=null,x0=0,dy=0;
  handle.addEventListener('touchstart',e=>{if(e.target.closest('input'))return;const t=e.touches[0];y0=t.clientY;x0=t.clientX;dy=0},{passive:true});
  handle.addEventListener('touchmove',e=>{
    if(y0===null)return;const t=e.touches[0];dy=t.clientY-y0;
    if(dy>0&&dy>Math.abs(t.clientX-x0)){panel.style.transition='none';panel.style.transform='translateY('+dy+'px)'}
  },{passive:true});
  handle.addEventListener('touchend',()=>{
    if(y0===null)return;panel.style.transition='';panel.style.transform='';
    if(dy>110)close();y0=null;dy=0;
  });
}
swipeDown($('#full'),$('#full'),()=>$('#full').classList.remove('on'));
swipeDown($('#qtopbar'),$('#qsheet'),closeQ);

/* color de fons segons la portada (inici i detall) */
function paint(src){
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{try{
    const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.drawImage(im,0,0,8,8);
    const d=x.getImageData(0,0,8,8).data;let r=0,g=0,b=0;const n=d.length/4;
    for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}
    document.documentElement.style.setProperty('--hc','rgb('+(r/n*.7|0)+','+(g/n*.7|0)+','+(b/n*.7|0)+')');
  }catch(e){}};
  im.src=src;
}

/* ---------- cerca ---------- */
let st;
$('#q').oninput=()=>{clearTimeout(st);st=setTimeout(doSearch,300)};
async function doSearch(){
  const q=$('#q').value.trim();
  const secs=[['#s-art',artistCards],['#s-alb',albumCards],['#s-sng',(e,l)=>tracks(e,l,true)]];
  if(!q){secs.forEach(([s])=>{$(s).textContent='';$(s).previousElementSibling.hidden=true});$('#s-none').hidden=true;return}
  try{
    const r=(await api('search3',{query:q,artistCount:6,albumCount:12,songCount:25})).searchResult3||{};
    const data=[r.artist||[],r.album||[],r.song||[]];
    secs.forEach(([s,fn],i)=>{fn($(s),data[i]);$(s).previousElementSibling.hidden=!data[i].length});
    $('#s-none').hidden=data.some(d=>d.length);
  }catch(e){msg('No s\u2019ha pogut fer la cerca: '+e.message)}
}

/* ---------- reproductor ---------- */
const setNp=c=>document.documentElement.style.setProperty('--np',c||'#3a3a3a');
function tint(src){
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{try{
    const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.drawImage(im,0,0,8,8);
    const d=x.getImageData(0,0,8,8).data;let r=0,g=0,b=0;const n=d.length/4;
    for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}
    setNp(`rgb(${r/n*.55|0},${g/n*.55|0},${b/n*.55|0})`);
  }catch(e){setNp()}};
  im.onerror=()=>setNp();im.src=src;
}
function play(i){
  idx=i;const t=queue[i];scrobbled=false;advancing=false;
  let src=url('stream',{id:t.id}),blob=null;
  if(pre&&pre.id===t.id){src=pre.url;blob=pre.url;pre=null}   /* ja és a la memòria: comença a l'instant */
  audio.src=src;
  if(curBlob)URL.revokeObjectURL(curBlob);
  curBlob=blob;
  audio.play().then(()=>{if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'}).catch(()=>{});
  setTimeout(prefetchNext,1500);
  const c=cover(t,600);
  $('#bar').classList.add('on');
  $('#ncov').src=$('#fcov').src=c;
  $('#ntit').textContent=$('#ftit').textContent=t.title;
  $('#nart').textContent=$('#fart').textContent=t.artist||'';
  $('#fctx').textContent=queueName||'Ara sona';
  tint(c);mark();syncHeart();if($('#qpanel').classList.contains('on'))renderQueue();
  api('scrobble',{id:t.id,submission:'false'}).catch(()=>{});
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||'',album:t.album||'',artwork:[{src:c,sizes:'600x600'}]});
}
/* descarrega la cançó següent a la memòria mentre sona l'actual, així el canvi no depèn de la xarxa */
async function prefetchNext(){
  const n=queue[idx+1];
  if(!n||(pre&&pre.id===n.id))return;
  if(pre){URL.revokeObjectURL(pre.url);pre=null}
  const id=n.id,my=++preBusy;
  try{
    const r=await fetch(url('stream',{id}));
    if(!r.ok)return;
    const b=await r.blob();
    if(my!==preBusy||!queue[idx+1]||queue[idx+1].id!==id)return;
    pre={id,url:URL.createObjectURL(b)};
  }catch(e){}
}
const next=()=>{if(rnd&&idx>=queue.length-3)moreRandom();if(idx+1<queue.length)play(idx+1)};
const prev=()=>{if(audio.currentTime>3||idx===0)audio.currentTime=0;else play(idx-1)};
audio.addEventListener('ended',()=>{if(stopAfter){stopAfter=false;syncTimer();return}next()});
audio.addEventListener('play',()=>setPP(true));
audio.addEventListener('pause',()=>setPP(false));
audio.addEventListener('timeupdate',()=>{
  const d=audio.duration,c=audio.currentTime;
  if(d){
    const p=c/d*100;$('#prog i').style.width=p+'%';$('#fseek').value=p;$('#fseek').style.setProperty('--p',p+'%');
    $('#tcur').textContent=fmt(c);$('#tdur').textContent='-'+fmt(d-c);
    if(!scrobbled&&queue[idx]&&(c>30||(d<60&&c>d/2))){scrobbled=true;api('scrobble',{id:queue[idx].id,submission:'true'}).catch(()=>{})}
    /* amb la pantalla bloquejada, salta a la següent just abans d'acabar, mentre l'àudio encara sona */
    if(document.hidden&&!advancing&&!stopAfter&&d>2&&d-c<0.6&&pre&&queue[idx+1]&&pre.id===queue[idx+1].id){advancing=true;next()}
    if('mediaSession' in navigator&&navigator.mediaSession.setPositionState){
      try{navigator.mediaSession.setPositionState({duration:d,position:c,playbackRate:1})}catch(e){}
    }
  }
});
$('#fseek').oninput=e=>{e.target.style.setProperty('--p',e.target.value+'%');if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
const toggle=()=>audio.paused?audio.play():audio.pause();
$('#pp').onclick=e=>{e.stopPropagation();toggle()};$('#fpp').onclick=toggle;
$('#bnext').onclick=e=>{e.stopPropagation();next()};$('#bprev').onclick=e=>{e.stopPropagation();prev()};
$('#fnext').onclick=next;$('#fprev').onclick=prev;
$('#bar').onclick=()=>$('#full').classList.add('on');
$('#fclose').onclick=()=>$('#full').classList.remove('on');
function bindMS(){
  if(!('mediaSession' in navigator))return;
  const m=navigator.mediaSession,set=(a,f)=>{try{m.setActionHandler(a,f)}catch(e){}};
  set('play',()=>audio.play());
  set('pause',()=>audio.pause());
  set('nexttrack',next);
  set('previoustrack',prev);
  set('seekbackward',null);   /* sense això iOS mostra els botons de \u00b110 s */
  set('seekforward',null);
  set('seekto',e=>{audio.currentTime=e.seekTime});
}
audio.addEventListener('playing',()=>{bindMS();if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'});
audio.addEventListener('pause',()=>{if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'});
audio.addEventListener('playing',()=>{errN=0});
audio.addEventListener('error',()=>{if(audio.getAttribute('src')&&!stopAfter&&idx+1<queue.length&&errN<3){errN++;next()}});
bindMS();
$('#fheart').onclick=()=>{if(queue[idx])toggleLike(queue[idx])};
$('#fmore').onclick=()=>{if(queue[idx])trackMenu(queue[idx])};
$('#newpl').onclick=newPlaylist;
$('#dmore').onclick=dMenu;
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
$('#shufall').onclick=playAllRandom;
$('#go').onclick=login;
$('#pwd').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
if(S)enter();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
