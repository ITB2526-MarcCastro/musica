<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Música">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Música</title>
<style>
:root{--bg:#1b1424;--surf:#271d35;--surf2:#322643;--line:#3a2d4d;--tx:#f2edf7;--mut:#a99bbd;--ac:#8fe3d0;--ac-tx:#12301f;--navw:220px;--tabh:calc(58px + env(safe-area-inset-bottom))}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;margin:0}
h3{font-size:1.2rem;margin:26px 0 12px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.view{display:none}.view.on{display:block}
main{padding:20px 16px calc(var(--tabh) + 120px)}
body.auth #nav,body.auth #bar{display:none!important}
body.auth main{padding-bottom:20px}

/* login */
#login{max-width:420px;margin:0 auto;padding-top:14vh}
#login h1{font-size:2.4rem;margin-bottom:6px}
#login p{color:var(--mut);margin:0 0 22px}
label{display:block;font-size:.9rem;color:var(--mut);margin:14px 0 4px}
input[type=text],input[type=password],input[type=search]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--tx);font:inherit}
.btn{width:100%;margin-top:22px;padding:13px;border-radius:10px;background:var(--ac);color:var(--ac-tx);font-weight:600}
.err{color:#ffb4a8;min-height:1.4em;font-size:.95rem;margin-top:10px}

/* navegació: pestanyes a baix al mòbil, barra lateral a pantalla ampla */
#nav{position:fixed;left:0;right:0;bottom:0;height:var(--tabh);padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--bg);border-top:1px solid var(--line);z-index:5}
#nav .brand{display:none}
#nav .t{flex:1;color:var(--mut);font-size:.82rem}
#nav .t.on{color:var(--ac);font-weight:600}
#bar{position:fixed;left:8px;right:8px;bottom:calc(var(--tabh) + 6px);background:var(--surf2);border-radius:12px;padding:10px 12px;z-index:4;display:none}
#bar.on{display:block}
@media(min-width:800px){
  #nav{top:0;bottom:92px;right:auto;width:var(--navw);height:auto;flex-direction:column;padding:26px 12px;border-top:0;border-right:1px solid var(--line)}
  #nav .brand{display:block;font:600 1.5rem Georgia,serif;margin:0 0 22px 12px}
  #nav .t{flex:none;text-align:left;padding:11px 12px;border-radius:8px;font-size:1rem}
  #nav .t.on{background:var(--surf)}
  main{margin-left:var(--navw);padding:28px 32px 130px;max-width:1100px}
  #bar{left:0;right:0;bottom:0;border-radius:0;border-top:1px solid var(--line);padding:12px 24px}
  #login{margin:0 auto}
  body.auth main{margin-left:0}
}

/* inici */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.9rem}
.top button{color:var(--mut);padding:6px 2px}
.chips{display:flex;gap:8px;margin:16px 0 4px}
.chips button{padding:7px 14px;border-radius:99px;background:var(--surf);color:var(--mut)}
.chips button.on{background:var(--ac);color:var(--ac-tx);font-weight:600}
#q{margin-top:14px;border-radius:99px;padding:13px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.card{text-align:left;min-width:0}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--surf);display:block}
.card.round img{border-radius:50%}
.card.round{text-align:center}
.card b{display:block;margin-top:8px;font-size:.95rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card span{display:block;color:var(--mut);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mut);padding:18px 0}

/* detall */
.back{color:var(--ac);margin-bottom:14px;padding:6px 0}
.head{display:flex;gap:16px;align-items:flex-end;margin-bottom:12px}
.head img{width:120px;height:120px;border-radius:6px;object-fit:cover;background:var(--surf);flex:none}
.head h2{font-size:1.5rem;line-height:1.2}
.head p{margin:4px 0 0;color:var(--mut)}
#dplay{padding:10px 22px;border-radius:99px;background:var(--ac);color:var(--ac-tx);font-weight:600;margin:6px 0 10px}
.tr{display:flex;width:100%;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);text-align:left;align-items:center}
.tr i{font-style:normal;color:var(--mut);width:1.6em;text-align:right;flex:none}
.tr div{flex:1;min-width:0}
.tr b,.tr span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr b{font-weight:500}.tr span{color:var(--mut);font-size:.85rem}
.tr small{color:var(--mut)}
.tr.cur b,.tr.cur i{color:var(--ac)}

/* reproductor */
#np{display:flex;align-items:center;gap:12px}
#np img{width:44px;height:44px;border-radius:4px;object-fit:cover;background:var(--surf)}
#np div{flex:1;min-width:0}
#np b,#np span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#np span{color:var(--mut);font-size:.85rem}
#np button{width:42px;height:42px;border-radius:50%;font-size:1.15rem}
#pp{background:var(--ac);color:var(--ac-tx)}
#seek{width:100%;margin:8px 0 0;accent-color:var(--ac)}
@media(prefers-reduced-motion:no-preference){.view.on{animation:in .15s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body class="auth">

<nav id="nav" aria-label="Navegació">
  <div class="brand">Música</div>
  <button class="t on" data-v="home">Inici</button>
  <button class="t" data-v="search">Cerca</button>
  <button class="t" data-v="lib">Biblioteca</button>
</nav>

<main>
  <div class="err" id="err" role="alert"></div>

  <section id="login" class="view on">
    <h1>Música</h1>
    <p>Entra per escoltar la teva biblioteca.</p>
    <label for="usr">Usuari</label>
    <input id="usr" type="text" autocapitalize="none" autocorrect="off" autocomplete="username">
    <label for="pwd">Contrasenya</label>
    <input id="pwd" type="password" autocomplete="current-password">
    <button class="btn" id="go">Entra</button>
    <div class="err" id="lerr" role="alert"></div>
  </section>

  <section id="home" class="view">
    <div class="top"><h1 id="hello">Hola</h1><button id="out">Surt</button></div>
    <h3>Afegits fa poc</h3><div class="grid" id="h-new"></div>
    <h3>Per descobrir</h3><div class="grid" id="h-rnd"></div>
  </section>

  <section id="search" class="view">
    <input id="q" type="search" placeholder="Artistes, àlbums o cançons" aria-label="Cerca" autocapitalize="none" autocorrect="off">
    <h3 hidden>Artistes</h3><div class="grid" id="s-art"></div>
    <h3 hidden>Àlbums</h3><div class="grid" id="s-alb"></div>
    <h3 hidden>Cançons</h3><div id="s-sng"></div>
    <div class="empty" id="s-none" hidden>No hi ha resultats.</div>
  </section>

  <section id="lib" class="view">
    <div class="top"><h1>Biblioteca</h1></div>
    <div class="chips">
      <button data-t="albums" class="on">Àlbums</button>
      <button data-t="artists">Artistes</button>
      <button data-t="playlists">Playlists</button>
    </div>
    <div class="grid" id="l-grid" style="margin-top:14px"></div>
    <div class="empty" id="l-none" hidden></div>
  </section>

  <section id="detail" class="view">
    <button class="back" id="back">Enrere</button>
    <div class="head"><img id="dcov" alt=""><div><h2 id="dtit"></h2><p id="dsub"></p></div></div>
    <button id="dplay">Reprodueix</button>
    <div id="dtracks"></div>
    <div class="grid" id="dgrid"></div>
  </section>
</main>

<div id="bar">
  <div id="np">
    <img id="ncov" alt="">
    <div><b id="ntit"></b><span id="nart"></span></div>
    <button id="prev" aria-label="Anterior">&#9198;&#65038;</button>
    <button id="pp" aria-label="Reprodueix o pausa">&#9654;&#65038;</button>
    <button id="next" aria-label="Següent">&#9197;&#65038;</button>
  </div>
  <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posició">
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
/* Adreça del servidor (Tailscale). Canvia-la aquí si mai canvia. */
const SERVER='https://desktop-bbnvq3i.tailbebfdd.ts.net';

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const audio=$('#audio');
let S=null,queue=[],idx=-1,prevView='home',libTab='albums';
try{S=JSON.parse(localStorage.getItem('session')||'null')}catch(e){}

const qs=(x={})=>new URLSearchParams({u:S.user,t:S.token,s:S.salt,v:'1.16.1',c:'musica-pwa',...x});
const url=(ep,p)=>`${SERVER}/rest/${ep}?${qs(p)}`;
const cover=(o,s=300)=>url('getCoverArt',{id:o.coverArt||o.albumId||o.id,size:s});
const fmt=s=>s?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'';
const msg=t=>{$('#err').textContent=t||''};

async function api(ep,p){
  const r=await fetch(url(ep,{...p,f:'json'}));
  const j=(await r.json())['subsonic-response'];
  if(j.status!=='ok'){
    if(j.error&&(j.error.code===40||j.error.code===41)){logout();throw new Error('La sessió ha caducat. Torna a entrar.')}
    throw new Error(j.error?.message||'Error del servidor');
  }
  return j;
}

/* ---------- sessió ---------- */
async function login(){
  const user=$('#usr').value.trim(),pass=$('#pwd').value;
  $('#lerr').textContent='';
  try{
    const r=await fetch(SERVER+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
    if(r.status===401)throw new Error('Usuari o contrasenya incorrectes.');
    if(!r.ok)throw new Error('El servidor ha respost amb l\u2019error '+r.status+'.');
    const j=await r.json();
    S={user,token:j.subsonicToken,salt:j.subsonicSalt};
    localStorage.setItem('session',JSON.stringify(S));
    $('#pwd').value='';
    enter();
  }catch(e){
    $('#lerr').textContent=e instanceof TypeError
      ?'No s\u2019ha pogut connectar. Comprova que Tailscale està actiu al mòbil i que el portàtil està encès.'
      :e.message;
  }
}
function logout(){
  localStorage.removeItem('session');S=null;
  audio.pause();audio.removeAttribute('src');queue=[];idx=-1;
  $('#bar').classList.remove('on');
  document.body.classList.add('auth');go('login',false);
}
function enter(){
  document.body.classList.remove('auth');
  const h=new Date().getHours();
  $('#hello').textContent=(h<6?'Bona nit':h<13?'Bon dia':h<20?'Bona tarda':'Bona nit')+', '+S.user;
  go('home');loadHome();
}

/* ---------- navegació ---------- */
function go(v,tab=true){
  $$('.view').forEach(e=>e.classList.toggle('on',e.id===v));
  if(tab){$$('#nav .t').forEach(b=>b.classList.toggle('on',b.dataset.v===v));prevView=v}
  msg('');window.scrollTo(0,0);
}
$$('#nav .t').forEach(b=>b.onclick=()=>{
  const v=b.dataset.v;go(v);
  if(v==='home')loadHome();
  if(v==='lib')loadLib();
  if(v==='search')$('#q').focus();
});
$('#back').onclick=()=>go(prevView);
$$('.chips button').forEach(b=>b.onclick=()=>{
  libTab=b.dataset.t;$$('.chips button').forEach(x=>x.classList.toggle('on',x===b));loadLib();
});

/* ---------- peces d'interfície ---------- */
function card(o,title,sub,fn,round){
  const b=document.createElement('button');b.className='card'+(round?' round':'');
  b.innerHTML='<img loading="lazy" alt=""><b></b><span></span>';
  b.children[0].src=cover(o);b.children[1].textContent=title;b.children[2].textContent=sub||'';
  b.onclick=fn;return b;
}
const albumCards=(el,list)=>{el.textContent='';list.forEach(a=>el.append(card(a,a.name||a.title,a.artist,()=>openAlbum(a.id))))};
const artistCards=(el,list)=>{el.textContent='';list.forEach(a=>el.append(card(a,a.name,(a.albumCount||0)+' àlbums',()=>openArtist(a.id),true)))};

function tracks(el,songs){
  el.textContent='';
  songs.forEach((t,i)=>{
    const b=document.createElement('button');b.className='tr';b.dataset.id=t.id;
    b.innerHTML='<i></i><div><b></b><span></span></div><small></small>';
    b.children[0].textContent=i+1;
    b.children[1].children[0].textContent=t.title;
    b.children[1].children[1].textContent=t.artist||'';
    b.children[2].textContent=fmt(t.duration);
    b.onclick=()=>{queue=songs.slice();play(i)};
    el.append(b);
  });
  mark();
}
const mark=()=>$$('.tr').forEach(r=>r.classList.toggle('cur',!!queue[idx]&&r.dataset.id===queue[idx].id));

/* ---------- pantalles ---------- */
async function loadHome(){
  try{
    const [n,r]=await Promise.all([api('getAlbumList2',{type:'newest',size:12}),api('getAlbumList2',{type:'random',size:12})]);
    albumCards($('#h-new'),n.albumList2.album||[]);albumCards($('#h-rnd'),r.albumList2.album||[]);
  }catch(e){msg('No s\u2019ha pogut carregar l\u2019inici: '+e.message)}
}

async function loadLib(){
  const g=$('#l-grid'),n=$('#l-none');n.hidden=true;g.textContent='';
  try{
    if(libTab==='albums'){
      const l=(await api('getAlbumList2',{type:'alphabeticalByName',size:500})).albumList2.album||[];
      albumCards(g,l);if(!l.length){n.hidden=false;n.textContent='Encara no hi ha cap àlbum. Afegeix música a la carpeta del servidor.'}
    }else if(libTab==='artists'){
      const l=((await api('getArtists')).artists.index||[]).flatMap(i=>i.artist||[]);
      artistCards(g,l);if(!l.length){n.hidden=false;n.textContent='Encara no hi ha cap artista.'}
    }else{
      const l=(await api('getPlaylists')).playlists.playlist||[];
      g.textContent='';l.forEach(p=>g.append(card(p,p.name,(p.songCount||0)+' cançons',()=>openPlaylist(p.id))));
      if(!l.length){n.hidden=false;n.textContent='Encara no tens cap playlist.'}
    }
  }catch(e){msg('No s\u2019ha pogut carregar la biblioteca: '+e.message)}
}

function detail(h,songs,albums){
  $('#dcov').src=h.img;$('#dtit').textContent=h.title;$('#dsub').textContent=h.sub||'';
  const t=$('#dtracks'),g=$('#dgrid');t.textContent='';g.textContent='';
  const p=$('#dplay');p.hidden=!(songs&&songs.length);
  if(songs){tracks(t,songs);p.onclick=()=>{queue=songs.slice();play(0)}}
  if(albums)albumCards(g,albums);
  go('detail',false);
}
async function openAlbum(id){try{const a=(await api('getAlbum',{id})).album;detail({img:cover(a),title:a.name,sub:a.artist},a.song||[])}catch(e){msg(e.message)}}
async function openArtist(id){try{const a=(await api('getArtist',{id})).artist;detail({img:cover(a),title:a.name,sub:(a.albumCount||0)+' àlbums'},null,a.album||[])}catch(e){msg(e.message)}}
async function openPlaylist(id){try{const p=(await api('getPlaylist',{id})).playlist;detail({img:cover(p),title:p.name,sub:(p.songCount||0)+' cançons'},p.entry||[])}catch(e){msg(e.message)}}

/* ---------- cerca ---------- */
let st;
$('#q').oninput=()=>{clearTimeout(st);st=setTimeout(doSearch,300)};
async function doSearch(){
  const q=$('#q').value.trim();
  const secs=[['#s-art',artistCards],['#s-alb',albumCards],['#s-sng',tracks]];
  if(!q){secs.forEach(([s])=>{$(s).textContent='';$(s).previousElementSibling.hidden=true});$('#s-none').hidden=true;return}
  try{
    const r=(await api('search3',{query:q,artistCount:6,albumCount:12,songCount:25})).searchResult3||{};
    const data=[r.artist||[],r.album||[],r.song||[]];
    secs.forEach(([s,fn],i)=>{fn($(s),data[i]);$(s).previousElementSibling.hidden=!data[i].length});
    $('#s-none').hidden=data.some(d=>d.length);
  }catch(e){msg('No s\u2019ha pogut fer la cerca: '+e.message)}
}

/* ---------- reproductor ---------- */
function play(i){
  idx=i;const t=queue[i];
  audio.src=url('stream',{id:t.id});
  audio.play().catch(()=>{});
  const c=cover(t,512);
  $('#bar').classList.add('on');
  $('#ncov').src=c;$('#ntit').textContent=t.title;$('#nart').textContent=t.artist||'';
  mark();
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||'',album:t.album||'',artwork:[{src:c,sizes:'512x512'}]});
}
const next=()=>{if(idx+1<queue.length)play(idx+1)};
const prev=()=>{if(audio.currentTime>3||idx===0)audio.currentTime=0;else play(idx-1)};
audio.addEventListener('ended',next);
audio.addEventListener('play',()=>{$('#pp').innerHTML='&#9208;&#65038;'});
audio.addEventListener('pause',()=>{$('#pp').innerHTML='&#9654;&#65038;'});
audio.addEventListener('timeupdate',()=>{
  if(audio.duration)$('#seek').value=audio.currentTime/audio.duration*100;
  if('mediaSession' in navigator&&audio.duration&&navigator.mediaSession.setPositionState){
    try{navigator.mediaSession.setPositionState({duration:audio.duration,position:audio.currentTime,playbackRate:1})}catch(e){}
  }
});
$('#seek').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
$('#pp').onclick=()=>audio.paused?audio.play():audio.pause();
$('#next').onclick=next;$('#prev').onclick=prev;
if('mediaSession' in navigator){
  const m=navigator.mediaSession;
  m.setActionHandler('play',()=>audio.play());
  m.setActionHandler('pause',()=>audio.pause());
  m.setActionHandler('nexttrack',next);
  m.setActionHandler('previoustrack',prev);
  try{m.setActionHandler('seekto',e=>{audio.currentTime=e.seekTime})}catch(e){}
}

$('#go').onclick=login;
$('#pwd').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('#out').onclick=logout;
if(S)enter();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
